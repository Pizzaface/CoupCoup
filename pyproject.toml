[tool.poetry]
name = "aicoupcoup"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
httpx = "*"
pydantic = "*"
jinja2 = "*"
asyncstdlib = "*"
beautifulsoup4 = "*"
thefuzz = "*"
tdqm = "*"
pyppeteer = "^1.0.2"
more-itertools = "^10.1.0"
aioitertools = "^0.11.0"
google-cloud-aiplatform = ">=1.38"
google-generativeai = "^0.4.1"
loguru = "^0.7.2"
openrouteservice = "^2.3.3"
folium = "^0.16.0"
pandas = "^2.2.1"
rapidfuzz = "^3.7.0"
openpyxl = "^3.1.2"
orjson = "^3.10.0"
aiometer = "^0.5.0"
async-timeout = "^4.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"
factory-boy = "^3.3.0"
faker = "^24.0.0"
respx = "^0.21.0"
freezegun = "^1.4.0"
pytest-timeout = "^2.2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
timeout = 300

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
