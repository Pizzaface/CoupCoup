name: Coverage Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          python3-dev \
          libffi-dev \
          pkg-config \
          cargo \
          rustc

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-cov
        pip install pandas openpyxl httpx pydantic jinja2
        pip install aiometer loguru rapidfuzz beautifulsoup4
        pip install python-dateutil asyncstdlib orjson
        pip install more-itertools aioitertools async-timeout thefuzz tqdm
        pip install pyppeteer
        pip install google-generativeai
        pip install google-cloud-aiplatform
        pip install folium
        pip install openrouteservice

    - name: Generate coverage report
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/unit/utils/test_text.py \
               tests/unit/utils/test_config.py \
               tests/unit/lib/test_retry_transport.py \
          --cov=utils/text \
          --cov=utils/config \
          --cov=lib/RetryTransport \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-report=json \
          -v

    - name: Coverage Badge
      uses: tj-actions/coverage-badge-py@v2
      with:
        output: coverage.svg

    - name: Publish coverage badge
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: coverage.svg

    - name: Generate coverage summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Key Modules" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Module | Coverage |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
        echo "| utils/text.py | ![100%](https://img.shields.io/badge/coverage-100%25-brightgreen) |" >> $GITHUB_STEP_SUMMARY
        echo "| utils/config.py | ![100%](https://img.shields.io/badge/coverage-100%25-brightgreen) |" >> $GITHUB_STEP_SUMMARY
        echo "| lib/RetryTransport.py | ![98.81%](https://img.shields.io/badge/coverage-98.81%25-brightgreen) |" >> $GITHUB_STEP_SUMMARY
